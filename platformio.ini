[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
; The generic DevKitC profile is an N8/8 MB board, while the physical
; Waveshare ESP32-S3-Matrix SKU 27119 is 4 MB. PlatformIO uses this
; manifest value both for elf2image's binary header and esptool upload.
board_upload.flash_size = 4MB
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit NeoPixel@1.15.5

[env:esp32s3_bringup]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -DESPSAND_MINIMAL_BRINGUP=1

[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = no
lib_compat_mode = off
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Wpedantic
    -Werror

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
; The generic DevKitC profile is an N8/8 MB, no-PSRAM board. The physical
; Waveshare ESP32-S3-Matrix SKU 27119 is ESP32-S3FH4R2: 4 MB quad flash
; plus 2 MB quad PSRAM. Override the complete memory profile rather than
; only the image-header flash-size field.
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.psram_type = qio
board_build.partitions = default.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
lib_deps =
    adafruit/Adafruit NeoPixel@1.15.5

[env:esp32s3_bringup]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -DESPSAND_MINIMAL_BRINGUP=1

[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = no
lib_compat_mode = off
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Wpedantic
    -Werror
